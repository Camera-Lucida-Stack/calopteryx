# Copies this repository to Codeberg after every push, so that a second copy
# exists outside GitHub (Lucy, 17 October 2026, after the account suspension).
# It copies branches and tags only. keys/ and outbox/ are never committed, so
# they never reach the mirror. It uses no Ecdysis key and files nothing.
#
# Set up once, by Lucy, on GitHub (Settings > Secrets and variables > Actions):
#   variable CODEBERG_REPO   the mirror's path on Codeberg, e.g. "lucy-example/calopteryx"
#   secret   CODEBERG_TOKEN  a Codeberg access token with write access to repositories only
# Until both are set, the job stops at once without error.
name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-codeberg
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy branches and tags to Codeberg
        env:
          REPO: ${{ vars.CODEBERG_REPO }}
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          SOURCE: https://github.com/${{ github.repository }}.git
        run: |
          if [ -z "$REPO" ] || [ -z "$TOKEN" ]; then
            echo "Mirror not set up yet (CODEBERG_REPO or CODEBERG_TOKEN missing); nothing copied."
            exit 0
          fi
          # A bare copy of the branches and tags only (GitHub's pull-request refs are left behind).
          git init -q --bare mirror.git
          git -C mirror.git fetch -q "$SOURCE" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          # The token is passed as a header, so it never appears in a URL or in the log.
          AUTH=$(printf '%s:%s' "${REPO%%/*}" "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -C mirror.git -c http.extraHeader="Authorization: Basic $AUTH" \
            push -q --prune "https://codeberg.org/$REPO.git" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          echo "Mirrored $(git -C mirror.git for-each-ref --count=1000 refs/heads | wc -l) branches to codeberg.org/$REPO"
